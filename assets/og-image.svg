<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Brand Mark -->
  <g transform="translate(100, 100)">
    <rect width="64" height="64" rx="14" fill="#ffffff"/>
    <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#09090b" text-anchor="middle">AD</text>
  </g>

  <!-- Title & Headline -->
  <text x="100" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#f4f4f5" letter-spacing="-1">Ashel Dsouza</text>
  
  <text x="100" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#a1a1aa">
    MCA Student  |  Aspiring Software Developer  |  AI &amp; ML Enthusiast
  </text>

  <text x="100" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#71717a">
    Poornaprajna Institute of Management (PIM) · Udupi, Karnataka
  </text>

