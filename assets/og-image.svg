    <rect x="200" y="0" width="190" height="44" rx="22" fill="#27272a"/>
    <text x="295" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5" text-anchor="middle">Software Engineering</text>

    <rect x="410" y="0" width="150" height="44" rx="22" fill="#27272a"/>
    <text x="485" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5" text-anchor="middle">AI &amp; Machine Learning</text>

    <rect x="580" y="0" width="160" height="44" rx="22" fill="#27272a"/>
